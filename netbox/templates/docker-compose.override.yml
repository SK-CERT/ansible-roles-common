services:
  redis:
    restart: unless-stopped
    networks:
      netbox_redis:
  redis-cache:
    restart: unless-stopped
    networks:
      netbox_redis:
  postgres:
    restart: unless-stopped
    networks:
      netbox_db:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/traefik:/etc/traefik
      - /opt/certs:/opt/certs:ro
    networks:
      traefik_net:
      netbox_db:
  netbox-worker:
    restart: unless-stopped
    networks:
      netbox_db:
      netbox_redis:
  netbox:
    restart: unless-stopped
    networks:
      traefik_net:
      netbox_db:
      netbox_redis:
    labels:
      traefik.enable: true
      traefik.http.routers.ipam.tls: true
      traefik.http.routers.ipam.entrypoints: websecure
      traefik.http.routers.ipam.rule: "Host(`{{ netbox_domain }}`)"
      traefik.http.routers.ipam.service: "ipam"
      traefik.http.services.ipam.loadbalancer.server.port: "8080"

    healthcheck:
      start_period: 90s
      retries: 3
    environment:
{% if netbox_ldap_server_uri | default(False) %}
      REMOTE_AUTH_ENABLED: "true"
      REMOTE_AUTH_BACKEND: "netbox.authentication.LDAPBackend"
      REMOTE_AUTH_AUTO_CREATE_USER: "true"
      AUTH_LDAP_SERVER_URI: "{{ netbox_ldap_server_uri }}"
      AUTH_LDAP_BIND_DN: "{{ netbox_ldap_bind_dn }}"
      AUTH_LDAP_BIND_PASSWORD: "{{ netbox_ldap_bind_password }}"
      AUTH_LDAP_USER_SEARCH_BASEDN: "ou=users,{{ netbox_ldap_base }}"
      AUTH_LDAP_USER_SEARCH_ATTR: "uid"
      LDAP_IGNORE_CERT_ERRORS: "true"
      #AUTH_LDAP_GROUP_SEARCH_BASEDN: "ou=groups,{{ netbox_ldap_base }}"
      #AUTH_LDAP_MIRROR_GROUPS: "true"
      AUTH_LDAP_REQUIRE_GROUP_DN: "cn=AppIpamUsers,ou=groups,{{ netbox_ldap_base }}"
      AUTH_LDAP_IS_ADMIN_DN: "cn=AppIpamAdmins,ou=groups,{{ netbox_ldap_base }}"
      AUTH_LDAP_IS_SUPERUSER_DN: "cn=AppIpamAdmins,ou=groups,{{ netbox_ldap_base }}"
{% endif %}
      CHANGELOG_RETENTION: 1825

networks:
  netbox_db:
  netbox_redis:
  traefik_net:
    name: traefik_net
