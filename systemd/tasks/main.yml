- name: create service user
  user:
    name: "{{ systemd_service_user }}"
    comment: "Runner for {{ systemd_service_name }}"

- name: script perms
  file:
    path: "{{ systemd_service_script }}"
    owner: "{{ systemd_service_user }}"
    mode: 0750

- name: configure service
  template:
    src: systemd.service.j2
    dest: "/etc/systemd/system/{{ systemd_service_name }}.service"
  notify: reload systemd

- name: enable service
  systemd:
    name: "{{ systemd_service_name }}"
    enabled: "{{ systemd_service_enabled | default(true) }}"
